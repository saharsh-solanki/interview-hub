AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions OIDC - allows GitHub to deploy without access keys

Parameters:
  GitHubOrg:
    Type: String
    Default: saharsh-solanki

  GitHubRepo:
    Type: String
    Default: interview-hub

  GitHubBranch:
    Type: String
    Default: main

  FrontendBucketName:
    Type: String
    Default: interview-hub-frontend-dev-frontendbucket-hejiz7fwnzko

Resources:

  # Step 1: Tell AWS to trust tokens signed by GitHub
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Step 2: IAM role that GitHub Actions assumes
  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: interview-hub-github-deploy
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}

      Policies:
        # SAM deployment permissions
        - PolicyName: SAMDeploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStackResource
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/interview-hub-backend-dev/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*

              - Sid: SAMArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:GetBucketVersioning
                Resource:
                  - arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-hesyeba6wkex
                  - arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-hesyeba6wkex/*

              - Sid: LambdaManagement
                Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:ListTags
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:InvokeFunction
                  - lambda:AddPermission
                  - lambda:RemovePermission
                Resource:
                  - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:interview-hub-backend-dev-*

              - Sid: IAMPassRole
                Effect: Allow
                Action:
                  - iam:PassRole
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                Resource:
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/interview-hub-backend-dev-*

              - Sid: APIGateway
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - !Sub arn:aws:apigateway:${AWS::Region}::/apis/*
                  - !Sub arn:aws:apigateway:${AWS::Region}::/tags/*

              - Sid: CloudFormationTransform
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31

        # Frontend S3 deployment
        - PolicyName: FrontendDeploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3Sync
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub arn:aws:s3:::${FrontendBucketName}
                  - !Sub arn:aws:s3:::${FrontendBucketName}/*

Outputs:
  DeployRoleArn:
    Description: ARN for GitHub Actions workflows
    Value: !GetAtt GitHubActionsDeployRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-DeployRoleArn

  OIDCProviderArn:
    Description: GitHub OIDC Provider ARN
    Value: !Ref GitHubOIDCProvider
