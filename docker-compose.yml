
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview_hub
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend1:
    build: ./backend
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/interview_hub
    depends_on:
      db:
        condition: service_healthy

  backend2:
    build: ./backend
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/interview_hub
    depends_on:
      db:
        condition: service_healthy

  backend3:
    build: ./backend
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/interview_hub
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - nginx

volumes:
  pgdata:
