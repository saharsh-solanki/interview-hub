
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Interview Hub FastAPI Backend

Globals:
  Function:
    Timeout: 30
    MemorySize: 512

Resources:
  InterviewHubApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: dev
      CorsConfiguration:
        AllowOrigins:
          - https://d301pk4yaczsrn.cloudfront.net
          - http://localhost:5173
          - http://interview-hub-frontend-dev-frontendbucket-hejiz7fwnzko.s3-website-ap-southeast-2.amazonaws.com
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization

  InterviewHubFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          DB_HOST:
            Fn::ImportValue: interview-hub-database-dev-DatabaseEndpoint
          DB_PORT:
            Fn::ImportValue: interview-hub-database-dev-DatabasePort
          DB_NAME:
            Fn::ImportValue: interview-hub-database-dev-DatabaseName
          DB_SECRET_ARN:
            Fn::ImportValue: interview-hub-database-dev-DatabaseSecretArn
      Policies:
      - AWSLambdaVPCAccessExecutionRole
      - Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              Fn::ImportValue: interview-hub-database-dev-DatabaseSecretArn
      CodeUri: ../backend/
      Handler: app.main.handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref InterviewHubApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref InterviewHubApi
            Path: /{proxy+}
            Method: ANY
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: interview-hub-network-dev-LambdaSecurityGroup
        SubnetIds:
          - Fn::ImportValue: interview-hub-network-dev-PrivateSubnetA
          - Fn::ImportValue: interview-hub-network-dev-PrivateSubnetB

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${InterviewHubApi}.execute-api.${AWS::Region}.amazonaws.com/dev/"
